# app-1..3 (profile "app"): três instâncias no mesmo banco e fila — correção multi-instância.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo"]
      interval: 3s
      timeout: 3s
      retries: 30

  app-1: &app
    build: .
    env_file: .env.example
    environment:
      INSTANCE_NAME: app-1
      DATABASE_HOST: postgres
      SQS_ENDPOINT: http://localstack:4566
    ports:
      - "3001:3000"
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    profiles: ["app"]

  app-2:
    <<: *app
    environment:
      INSTANCE_NAME: app-2
      DATABASE_HOST: postgres
      SQS_ENDPOINT: http://localstack:4566
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    environment:
      INSTANCE_NAME: app-3
      DATABASE_HOST: postgres
      SQS_ENDPOINT: http://localstack:4566
    ports:
      - "3003:3000"
