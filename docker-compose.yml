# Perfil "app": migrate (one-shot) + app-1..3, três instâncias no mesmo banco e fila — correção multi-instância.
#   docker compose --profile app up --build
x-app-environment: &app-environment
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  SQS_ENDPOINT: http://localstack:4566

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      # 5433 no host para não colidir com um Postgres local na 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    env_file: .env.example
    environment: *app-environment
    command: ["bun", "run", "scripts/migrate.ts", "up"]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["app"]

  app-1: &app
    build: .
    env_file: .env.example
    environment:
      <<: *app-environment
      INSTANCE_NAME: app-1
    ports:
      - "3001:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health/live'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["app"]

  app-2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_NAME: app-2
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_NAME: app-3
    ports:
      - "3003:3000"
